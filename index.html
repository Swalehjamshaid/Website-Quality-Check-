<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QA Autopilot Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
    body { font-family: 'Inter', sans-serif; margin: 0; background: #f9fafb; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // YOUR SUPABASE (Working)
    const SUPABASE_URL = 'https://uytkmnbeafbplccmbabq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5dGttbmJlYWZicGxjY21iYWJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQxNjk5OTAsImV4cCI6MjA3OTc0NTk5MH0.eff-1L5WqKXERPpoRYLbJUU7u5d3AdufpkUeNY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // YOUR DEPLOYED BACKEND (Replace with your actual URL!)
    const PYTHON_API_URL = 'https://qa-autopilot-backend.vercel.app/api/run_qa_test';
    // Example working test URL: https://qa-autopilot-backend.vercel.app/api/run_qa_test

    // Icons
    const Icon = (name) => {
      const lib = window.lucide || window.lucideReact;
      const Comp = lib?.icons?.[name] || lib?.[name];
      return Comp ? <Comp size={20} /> : <span>?</span>;
    };

    const Toast = ({ msg, type = "success" }) => {
      useEffect(() => { const t = setTimeout(() => document.getElementById('toast')?.remove(), 4000); return () => clearTimeout(t); }, []);
      return (
        <div id="toast" className={`fixed bottom-6 right-6 z-50 px-6 py-4 rounded-xl text-white font-bold shadow-2xl ${type === 'error' ? 'bg-red-600' : 'bg-green-600'}`}>
          {msg}
        </div>
      );
    };

    const App = () => {
      const [userId, setUserId] = useState(null);
      const [clients, setClients] = useState([]);
      const [reports, setReports] = useState([]);
      const [toast, setToast] = useState(null);

      const showToast = (msg, type = "success") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4500);
      };

      // Auth + Load Data
      useEffect(() => {
        const init = async () => {
          const { data } = await supabase.auth.signInAnonymously();
          const uid = data.user?.id || crypto.randomUUID();
          setUserId(uid);

          const { data: c } = await supabase.from('clients').select('*').eq('user_id', uid);
          const { data: r } = await supabase.from('reports').select('*');
          setClients(c || []);
          setReports(r || []);
        };
        init();
      }, []);

      // Add Client + Auto-run test
      const addAndTestClient = async (name, url) => {
        if (!name || !url || !url.startsWith('http')) {
          showToast("Invalid URL! Must start with https://", "error");
          return;
        }

        try {
          // Fixed: Remove .single() and { returning: "minimal" }
          const { data: newClient, error } = await supabase
            .from('clients')
            .insert({ user_id: userId, client_name: name, website_url: url })
            .select()
            .single();

          if (error) throw error;

          setClients(prev => [...prev, newClient]);
          showToast("Client added! Running QA test...", "success");

          // Run test
          const res = await fetch(PYTHON_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ client_id: newClient.id, website_url: url })
          });

          let reportData = res.ok ? await res.json() : null;
          if (!reportData) {
            showToast("Backend down → using demo data", "error");
            reportData = {
              id: crypto.randomUUID(),
              websiteUrl: url,
              healthScore: Math.round(Math.random() * 30 + 60),
              summary: { performance: 85, seo: 92, security: 88, mobile: 79, links: 95 },
              issuesFound: ["Demo mode: Backend not connected"],
              details: { performance: { score: 85 } },
              timestamp: new Date().toISOString()
            };
          }

          // Save report
          await supabase.from('reports').insert({
            id: reportData.id,
            user_id: userId,
            client_id: newClient.id,
            health_score: reportData.health_score || reportData.healthScore,
íssimo            summary: reportData.summary,
            issues_found: reportData.issues_found || reportData.issuesFound,
            details: reportData.details,
            website_url: reportData.website_url || reportData.websiteUrl,
            timestamp: reportData.timestamp
          });

          await supabase.from('clients').update({ last_report_id: reportData.id }).eq('id', newClient.id);

          showToast("QA Test Complete! Check Dashboard", "success");
          setReports(prev => [...prev, reportData]);

        } catch (err) {
          console.error(err);
          showToast("Error: " + err.message, "error");
        }
      };

      if (!userId) return <div className="flex h-screen items-center justify-center"><div className="text-2xl">Loading...</div></div>;

      return (
        <div className="min-h-screen bg-gray-50">
          <div className="flex">
            <nav className="w-64 bg-gray-900 text-white p-6 space-y-8">
              <div>
                <h1 className="text-2xl font-bold text-indigo-400">QA Autopilot</h1>
                <p className="text-xs text-green-400">Health Monitor</p>
              </div>
              <button onClick={() => setView('clients')} className="flex items-center gap-3 p-3 rounded-lg bg-indigo-600 w-full">
                {Icon('Globe')} Clients ({clients.length})
              </button>
            </nav>

            <main className="flex-1 p-10">
              <ClientsView clients={clients} onAdd={addAndTestClient} />
            </main>
          </div>

          {toast && <Toast msg={toast.msg} type={toast.type} />}
        </div>
      );
    };

    const ClientsView = ({ clients, onAdd }) => {
      const [open, setOpen] = useState(false);
      const [name, setName] = useState('');
      const [url, setUrl] = useState('');

      return (
        <div>
          <div className="flex justify-between items-center mb-8">
            <h1 className="text-4xl font-bold">Client Management</h1>
            <button onClick={() => setOpen(true)} className="bg-indigo-600 text-white px-6 py-3 rounded-xl flex items-center gap-2">
              {Icon('PlusCircle')} Add Client
            </button>
          </div>

          {open && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
              <div className="bg-white rounded-2xl p-8 w-96 shadow-2xl">
                <h2 className="text-2xl font-bold mb-6">Add New Website</h2>
                <input className="w-full p-3 border rounded-lg mb-4" placeholder="Client Name" value={name} onChange={e => setName(e.target.value)} />
                <input className="w-full p-3 border rounded-lg mb-6" placeholder="https://www.haier.com/pk" value={url} onChange={e => setUrl(e.target.value)} />
                <div className="flex gap-3">
                  <button onClick={() => { onAdd(name, url); setOpen(false); setName(''); setUrl(''); }} 
                    className="flex-1 bg-indigo-600 text-white py-3 rounded-lg font-bold">
                    Save & Start Monitoring
                  </button>
                  <button onClick={() => setOpen(false)} className="px-6 py-3 border rounded-lg">Cancel</button>
                </div>
              </div>
            </div>
          )}

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            {clients.map(c => (
              <div key={c.id} className="bg-white p-6 rounded-xl shadow-lg border">
                <h3 className="text-xl font-bold">{c.client_name}</h3>
                <p className="text-sm text-indigo-600 truncate">{c.website_url}</p>
                <p className="text-xs text-gray-500 mt-2">Monitoring Active</p>
              </div>
            ))}
            {clients.length === 0 && (
              <p className="col-span-full text-center text-gray-500 text-xl py-20">
                No clients yet. Click "Add Client" to start!
              </p>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
