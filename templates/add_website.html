{% extends "base.html" %}
{% block title %}Add Website{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-lg shadow-xl p-8">
    <h2 class="text-3xl font-bold text-center text-indigo-700 mb-8">Add New Website</h2>
    <form method="POST">
        <div class="mb-6">
            <label class="block text-gray-700 font-bold mb-2">Website Name (Optional)</label>
            <input name="name" type="text" placeholder="My Blog" class="w-full px-4 py-3 border rounded-lg">
        </div>
        <div class="mb-8">
            <label class="block text-gray-700 font-bold mb-2">Website URL</label>
            <input name="url" type="text" required placeholder="example.com or https://example.com" class="w-full px-4 py-3 border rounded-lg">
        </div>
        <div class="text-center">
            <button type="submit" class="bg-indigo-700 text-white font-bold px-10 py-4 rounded-lg hover:bg-indigo-800 text-xl">
                Add & Start Monitoring
            </button>
        </div>
    </form>
</div>
{% endblock %}
