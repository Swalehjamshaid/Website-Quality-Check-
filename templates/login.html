<!DOCTYPE html>
<html>
<head>
  <title>FF Web Audit - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin:0; height:100vh; display:flex; align-items:center; justify-content:center;}
    .card {background:white; padding:60px 50px; border-radius:30px; box-shadow:0 30px 80px rgba(0,0,0,0.4); width:420px; text-align:center;}
    .logo {width:120px; border-radius:50%; margin-bottom:20px; border:4px solid #5e35b1;}
    h1 {color:#5e35b1; margin:0 0 40px; font-size:36px;}
    input {width:100%; padding:18px; margin:12px 0; border:2px solid #e0e0e0; border-radius:15px; font-size:17px; transition:0.3s;}
    input:focus {border-color:#5e35b1; outline:none;}
    button {width:100%; padding:18px; background:#5e35b1; color:white; border:none; border-radius:15px; font-size:20px; cursor:pointer; margin-top:20px; transition:0.3s;}
    button:hover {background:#4527a0; transform:translateY(-2px);}
    .error {background:#ffebee; color:#c62828; padding:15px; border-radius:12px; margin:20px 0;}
  </style>
</head>
<body>
<div class="card">
  {% if LOGO %}<img src="data:image/png;base64,{{ LOGO }}" class="logo">{% else %}<h1>FF Web Audit</h1>{% endif %}
  <p style="color:#666; font-size:18px; margin-bottom:30px;">Professional Website Quality Auditor</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <div class="error">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  <form method="post">
    <input name="email" placeholder="Email" value="roy.jamshaid@gmail.com" required>
    <input name="password" type="password" placeholder="Password" value="Jamshaid,1981" required>
    <button type="submit">Login to Dashboard</button>
  </form>
</div>
</body>
</html>
