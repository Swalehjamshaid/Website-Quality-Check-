<!DOCTYPE html>
<html>
<head>
  <title>37Metrics - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin:0; height:100vh; display:flex; align-items:center; justify-content:center;}
    .card {background:white; padding:50px; border-radius:25px; box-shadow:0 30px 60px rgba(0,0,0,0.4); width:400px; text-align:center;}
    h1 {color:#5e35b1; margin-bottom:30px; font-size:32px;}
    input {width:100%; padding:16px; margin:12px 0; border:2px solid #e0e0e0; border-radius:12px; font-size:16px;}
    button {width:100%; padding:16px; background:#5e35b1; color:white; border:none; border-radius:12px; font-size:18px; cursor:pointer; margin-top:20px;}
    button:hover {background:#4527a0;}
    .error {background:#f8d7da; color:#721c24; padding:12px; border-radius:8px; margin:15px 0;}
  </style>
</head>
<body>
<div class="card">
  <h1>37Metrics</h1>
  <p style="color:#666;">Professional Website Audit Tool</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <div class="error">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  <form method="post">
    <input name="email" placeholder="Email" value="roy.jamshaid@gmail.com" required>
    <input name="password" type="password" placeholder="Password" value="Jamshaid,1981" required>
    <button type="submit">Login</button>
  </form>
</div>
</body>
</html>
