{% extends "base.html" %}
{% block title %}Login - 37Metrics Auditor{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-lg shadow-xl p-8">
        <h2 class="text-3xl font-bold text-center text-indigo-700 mb-8">Login</h2>
        <form method="POST">
            <div class="mb-5">
                <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                <input name="email" type="email" required class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:border-indigo-500">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input name="password" type="password" required class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-700 text-white font-bold py-3 rounded-lg hover:bg-indigo-800 transition">
                Login
            </button>
        </form>
        <p class="text-center mt-6 text-gray-600">
            Don't have an account? <a href="{{ url_for('register') }}" class="text-indigo-600 font-bold">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
