<!DOCTYPE html>
<html>
<head>
  <title>37Metrics - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin:0; height:100vh; display:flex; align-items:center; justify-content:center;}
    .card {background:white; padding:40px; border-radius:20px; box-shadow:0 20px 40px rgba(0,0,0,0.3); width:380px;}
    h1 {text-align:center; color:#5e35b1; margin-bottom:30px;}
    input {width:100%; padding:14px; margin:10px 0; border:1px solid #ddd; border-radius:8px; font-size:16px;}
    button {width:100%; padding:14px; background:#5e35b1; color:white; border:none; border-radius:8px; font-size:18px; cursor:pointer;}
    .flash {padding:15px; margin:15px 0; border-radius:8px; background:#f8d7da; color:#721c24;}
  </style>
</head>
<body>
<div class="card">
  <h1>37Metrics</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <div class="flash">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  <form method="post">
    <input name="email" placeholder="Email" value="roy.jamshaid@gmail.com" required>
    <input name="password" type="password" placeholder="Password" value="Jamshaid,1981" required>
    <button type="submit">Login</button>
  </form>
</div>
</body>
</html>
