<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Quality Check Dashboard</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body>
    <div class="min-h-screen bg-gray-50 flex flex-col items-center py-10 px-4">
        
        <!-- Header -->
        <header class="bg-white shadow-md w-full max-w-2xl mx-auto rounded-lg mb-8 p-4">
            <h1 class="text-3xl font-bold text-gray-800 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-8 h-8 text-indigo-600 mr-3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v-4.875c0-.621.52-1.125 1.166-1.077 1.17.027 2.37.03 3.564 0 .646-.048 1.166.456 1.166 1.077V17.25m-3 2.25c-1.554 0-3.078-.26-4.498-.775L3.25 18v2.75l2.25-1.5 2.25 1.5 2.25-1.5zM12 18h.008v.008H12V18zm0 4.5c-5.803 0-10.5-4.697-10.5-10.5S6.197 1.5 12 1.5s10.5 4.697 10.5 10.5-4.697 10.5-10.5 10.5z" />
                </svg>
                Quality Check Dashboard
            </h1>
        </header>

        <!-- Input Form -->
        <div class="bg-white result-card w-full max-w-2xl mx-auto mb-6">
            <h2 class="text-xl font-semibold mb-3 text-gray-700">Start New Audit</h2>
            <form id="auditForm" class="flex flex-col sm:flex-row gap-3">
                <input type="url" id="urlInput" placeholder="Enter full URL (e.g., https://example.com)" required
                       class="flex-grow p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 shadow-sm"
                       value="https://google.com">
                <button type="submit" class="bg-indigo-600 text-white font-medium py-3 px-6 rounded-lg hover:bg-indigo-700 transition duration-150 shadow-md">
                    Run Check
                </button>
            </form>
        </div>

        <!-- Status Message -->
        <div id="statusMessage" class="w-full max-w-2xl mx-auto p-4 mb-6 text-center text-lg font-medium text-indigo-700 bg-indigo-100 rounded-lg hidden shadow-inner">
            Status will appear here.
        </div>

        <!-- Results Container -->
        <div id="resultsContainer" class="w-full max-w-2xl mx-auto grid grid-cols-1 gap-6">
            <p class="text-gray-500 text-center p-8">Submit a URL above to see audit results.</p>
        </div>
        
    </div>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
