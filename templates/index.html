<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Quality Check Dashboard</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Header / Navigation -->
    <header class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <h1 class="text-3xl font-bold text-gray-900 flex items-center">
                <svg class="w-8 h-8 text-indigo-600 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l2-2 2 2v13M9 19c-3.111 0-5-2-5-5s1.889-5 5-5m9 10c3.111 0 5-2 5-5s-1.889-5-5-5M12 4v16"></path></svg>
                Quality Check Dashboard
            </h1>
        </div>
    </header>

    <main class="max-w-7xl mx-auto py-8 sm:px-6 lg:px-8">
        <!-- Add New Website Form -->
        <div class="bg-white shadow-xl rounded-xl p-6 mb-8">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4 border-b pb-2">Add New Website for Audit</h2>
            <form id="add-website-form" class="space-y-4">
                <div>
                    <label for="url-input" class="block text-sm font-medium text-gray-700">Website URL (e.g., https://example.com)</label>
                    <input type="url" id="url-input" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 focus:border-indigo-500 focus:ring-indigo-500 transition duration-150">
                </div>
                <div>
                    <label for="schedule-select" class="block text-sm font-medium text-gray-700">Audit Schedule</label>
                    <select id="schedule-select" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 focus:border-indigo-500 focus:ring-indigo-500 transition duration-150">
                        <option value="manual">Manual (On-demand)</option>
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                    </select>
                </div>
                <button type="submit" class="w-full py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150">
                    Add Website & Start Initial Audit
                </button>
                <p id="form-message" class="text-sm text-center pt-2"></p>
            </form>
        </div>

        <!-- Website List Dashboard -->
        <div class="bg-white shadow-xl rounded-xl p-6">
            <h2 class="text-2xl font-semibold text-gray-800 mb-6 border-b pb-2">Website Audit Summary</h2>
            
            <div id="loading-spinner" class="text-center p-12 text-gray-500">
                <svg class="animate-spin h-8 w-8 text-indigo-600 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <p class="mt-2">Loading website data...</p>
            </div>

            <div id="website-list" class="space-y-4">
                <!-- Website cards will be injected here by dashboard.js -->
            </div>
            
            <div id="no-websites-message" class="hidden text-center p-12 text-gray-500">
                No websites added yet. Use the form above to start tracking a site.
            </div>
        </div>
    </main>

    <!-- Load Custom JavaScript -->
    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
