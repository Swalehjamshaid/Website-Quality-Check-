{% extends "base.html" %}
{% block title %}Register - 37Metrics Auditor{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-lg shadow-xl p-8">
        <h2 class="text-3xl font-bold text-center text-indigo-700 mb-8">Create Account</h2>
        <form method="POST">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Full Name</label>
                <input name="name" type="text" required class="w-full px-4 py-3 border rounded-lg">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                <input name="email" type="email" required class="w-full px-4 py-3 border rounded-lg">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input name="password" type="password" required class="w-full px-4 py-3 border rounded-lg">
            </div>
            <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700">
                Register
            </button>
        </form>
        <p class="text-center mt-6">Already have an account? <a href="{{ url_for('login') }}" class="text-indigo-600 font-bold">Login</a></p>
    </div>
</div>
{% endblock %}
