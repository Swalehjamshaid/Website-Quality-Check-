# =========================================================
# Nixpacks Configuration for a Pure Python/Flask Application
# =========================================================

# Phase 1: Setup (Ensure necessary system tools and WeasyPrint dependencies are available)
[phases.setup]
# Specifies the base versions of Python and core build tools
nixPkgs = ["python311", "pip", "gnumake", "gcc"]

# CRUCIAL FIX: Force installation of system libraries required for WeasyPrint (PDF generation)
# These package names are the correct runtime and dev libraries for Debian-based images.
aptPkgs = [
    "libpango-1.0-0",
    "libpangoft2-1.0-0",
    "libharfbuzz0b",
    "libxml2-dev",
    "libxslt1-dev",
    "libjpeg-dev",
]

# Phase 2: Install (Runs 'pip install -r requirements.txt' automatically)
# No custom command needed here.

# Phase 3: Start (Defines the command to start the web application)
[start]
# Explicitly sets the command to run the web server using Gunicorn, 
# as defined in your Procfile's 'web' process.
cmd = "gunicorn app:app --bind 0.0.0.0:$PORT"

# Final Build Configuration: Explicitly forces the Python builder.
# This prevents Nixpacks from incorrectly detecting Node.js (via stray package.json remnants) 
# and running the failing 'npm install' command.
[build]
name = "python"
