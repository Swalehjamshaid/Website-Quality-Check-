# Nixpacks configuration for Python + system deps required by WeasyPrint
[phases.setup]
nixPkgs = ["python311", "pip", "gnumake", "gcc"]
aptPkgs = [
"libgobject-2.0-0",
"libpango-1.0-0",
"libpangoft2-1.0-0",
"libharfbuzz0b",
"libxml2-dev",
"libxslt1-dev",
"libjpeg-dev",
"libcairo2-dev",
"libgirepository1.0-dev",
]


[start]
cmd = "gunicorn wsgi:application --bind 0.0.0.0:$PORT"


[build]
name = "python"
