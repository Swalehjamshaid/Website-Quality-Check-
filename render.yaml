services:
  # Your web service
  - type: web
    name: website-quality-check
    env: node
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: celery-broker

  # FIX: Move the broker here and define it as a Redis service
  - type: redis
    name: celery-broker
    plan: free
    ipAllowList: [] # optional: allows access from anywhere if empty, or strict list
