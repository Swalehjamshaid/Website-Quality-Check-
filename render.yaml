services:
# 1. Celery Worker/Scheduler Service (Lines 70-80 in your screenshot)
  - type: worker # The service type is 'worker' or 'cron' based on startCommand
    name: celery-scheduler
    region: us-east
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app beat --loglevel info # Using 'beat' suggests it's a scheduler
    envVars:
      # --- SUPABASE CREDENTIALS ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
        
      # Celery broker configuration
      # These reference the 'celery-broker' resource defined below
      - key: CELERY_BROKER_URL
        fromService:
          type: keyValue
          name: celery-broker
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyValue
          name: celery-broker

# 2. Redis/Key Value Store Resource (The fixed section)
resources:
  # 4. DATA STORE (Redis/Key Value for Celery Broker)
  - name: celery-broker # Name used in the 'fromService' references above
    type: keyvalue # <-- FIX: Defines it as a Key Value resource (Redis)
    plan: starter # Provides data persistence, recommended for queues
    region: us-east
    # Configuration properties for the Key Value store
    maxmemoryPolicy: noeviction # Recommended for job queues to prevent loss of tasks
