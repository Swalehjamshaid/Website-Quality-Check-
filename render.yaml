services:
  # ──────────────────────────────
  # 1. Web Service (Flask + Gunicorn)
  # ──────────────────────────────
  - type: web
    name: website-quality-check
    runtime: docker
    repo: https://github.com/SwalehJamshaid/Website-Quality-Check
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /
    autoDeploy: true

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure key

  # ──────────────────────────────
  # 2. Background Worker (Celery)
  # ──────────────────────────────
  - type: worker
    name: website-quality-check-worker
    runtime: docker
    repo: https://github.com/SwalehJamshaid/Website-Quality-Check
    dockerfilePath: Dockerfile
    plan: free
    dockerCommand: celery -A app.celery_app worker --loglevel=info

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        fromService:
          type: web                     # ← THIS LINE WAS MISSING
          name: website-quality-check   # ← exact web service name
          envVarKey: SECRET_KEY         # ← key generated above
