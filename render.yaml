services:
  - type: web
    name: website-quality-check
    runtime: docker
    region: oregon
    plan: free
    # Fixed repo URL (no .git, no trailing hyphen in name)
    repo: https://github.com/Swalehjamshaid/Website-Quality-Check
    # Branch omitted—auto-uses default (main) to avoid validation errors
    dockerfilePath: Dockerfile
    autoDeploy: true  # Locked for commit-based deploys

    healthCheckPath: /

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"  # Locked as requested—improves log output
      - key: SECRET_KEY
        generateValue: true  # Auto-generates secure key for Flask
      # Add more if needed (e.g., for DB/Celery):
      # - key: DATABASE_URL
      #   sync: false  # Set in Render dashboard for security
