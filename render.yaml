
# render.yaml — Schema-valid for Blueprints
services:
  - type: web
    name: website-quality-check            # <— change to your service name
    runtime: python
    region: oregon                         # optional
    plan: free                             # or starter, etc.

    # Link to your repo and branch
    repo: https://github.com/your-org/your-repo
    branch: main                           # <— use the EXACT branch that exists (e.g., master)

    # Build & start
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120

    # Health check — use ONLY this field
    healthCheckPath: /

    autoDeploy: true

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # - key: DATABASE_URL
      #   value: postgres://....
