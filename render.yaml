services:
  - type: web
    name: rest-express
    env: node
    plan: free
    # We list the files to debug if package.json is missing in the logs
    # and force install devDependencies for the build script
    buildCommand: ls -la && npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
