# render.yaml – Minimal & Schema-Valid (Dec 2025)
services:
  - type: web
    name: rest-express-azay  # Your service name (update if needed)
    env: python  # Enables Python runtime (auto-detects version from runtime.txt)
    plan: free  # Free tier; upgrade to starter/standard for more resources
    region: oregon  # Optional: Low-latency US West

    # Repo & Branch
    repo: https://github.com/SwalehJamshaid/Website-Quality-Check
    branch: main  # Confirm this branch has app.py & requirements.txt

    # Build & Start (Critical for Flask)
    buildCommand: pip install -r requirements.txt  # Installs Flask, gunicorn, etc.
    startCommand: gunicorn app:app  # Runs your app.py (with app = Flask(__name__))

    # Health Check
    healthCheckPath: /

    # Scaling & Auto-Deploy
    autoDeploy: true
    numInstances: 1  # Free tier max

    # Env Vars (Replace placeholders with real values)
    envVars:
      - key: DATABASE_URL
        value: postgresql://user:pass@host:5432/dbname  # Your actual DB connection string
      - key: PYTHONUNBUFFERED
        value: "1"  # Better logging
      # Uncomment/add secrets as needed:
      # - key: SECRET_KEY
      #   value: your-flask-secret-key-here
