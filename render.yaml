# render.yaml (Corrected Production-ready Blueprint for Render)

# --- TOP-LEVEL SERVICES SECTION ---
services:
  - type: worker
    name: celery-scheduler
    region: us-east
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app beat --loglevel info

    # Environment Variables (Config Vars)
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: keyValue
          name: celery-broker
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyValue
          name: celery-broker

# --- TOP-LEVEL RESOURCES SECTION ---
resources:
  - name: celery-broker
    type: keyvalue
    plan: starter
    region: us-east
    maxmemoryPolicy: noeviction
