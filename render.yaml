# render.yaml (Complete Blueprint File)

# --- TOP-LEVEL SERVICES SECTION ---
services: # <--- MUST start at the far left margin (ZERO INDENTATION)
  - type: worker # <--- FIX for "expected 'type' in object"
    name: celery-scheduler
    region: us-east
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app beat --loglevel info 
    
    # Environment Variables (Config Vars)
    envVars:
      # SUPABASE CREDENTIALS
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
        
      # Celery broker configuration
      - key: CELERY_BROKER_URL
        fromService:
          type: keyValue
          name: celery-broker
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyValue
          name: celery-broker

# --- TOP-LEVEL RESOURCES SECTION ---
resources: # <--- FIX for "Field resources not found in type File.Spec"
  # This key MUST start at the far left margin (ZERO INDENTATION)
  - name: celery-broker
    type: keyvalue
    plan: starter 
    region: us-east
    maxmemoryPolicy: noeviction
