services:
  # Web App (Flask + Gunicorn)
  - type: web
    name: website-quality-check
    runtime: docker
    repo: https://github.com/SwalehJamshaid/Website-Quality-Check
    branch: main
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /
    autoDeploy: true

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        generateValue: true

  # Celery Worker
  - type: worker
    name: website-quality-check-worker
    runtime: docker
    repo: https://github.com/SwalehJamshaid/Website-Quality-Check
    branch: main
    plan: free
    dockerfilePath: Dockerfile
    dockerCommand: celery -A app.celery_app worker --loglevel=info

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        fromService:
          type: web
          name: website-quality-check
          envVarKey: SECRET_KEY
