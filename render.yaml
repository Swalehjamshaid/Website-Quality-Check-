services: # <--- Must be at zero indentation (Column 1)
  - type: worker 
    name: celery-scheduler
    region: us-east
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app beat --loglevel info 
    
    # Environment Variables (Using the correct LIST format)
    envVars:
      - key: SUPABASE_URL # <-- FIX: Correct list item structure
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY # <-- FIX: Correct list item structure
        sync: false
        
      - key: CELERY_BROKER_URL
        fromService:
          type: keyValue
          name: celery-broker
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyValue
          name: celery-broker

resources: # <--- Must be at zero indentation (Column 1)
  - name: celery-broker
    type: keyvalue
    plan: starter 
    region: us-east
    maxmemoryPolicy: noeviction
