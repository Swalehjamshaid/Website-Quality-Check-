# --- TOP-LEVEL SERVICES SECTION ---
services:
  - type: worker
    name: celery-scheduler
    region: us-east
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app beat --loglevel info

    # Environment Variables (Config Vars)
    envVars:
      # SUPABASE CREDENTIALS
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Celery broker configuration
      - key: CELERY_BROKER_URL
        fromService:
          type: keyValue
          name: celery-broker
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyValue
          name: celery-broker

# --- TOP-LEVEL RESOURCES SECTION (MUST BE AT ZERO INDENTATION) ---
resources:
  # 4. DATA STORE (Redis/Key Value for Celery Broker)
  - name: celery-broker
    type: keyvalue
    plan: starter
    region: us-east
    # Configuration properties for the Key Value store
    maxmemoryPolicy: noeviction
