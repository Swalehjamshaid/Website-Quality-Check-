services:
  # Web service
  - type: web
    name: website-quality-check
    plan: starter
    region: virginia
    dockerfilePath: Dockerfile

    envVars:
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: celery-broker
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: celery-broker
          property: connectionString
      - key: SUPABASE_URL
        value: https://<your-project-ref>.supabase.co
      - key: SUPABASE_ANON_KEY
        value: <your-anon-key>
      - key: SUPABASE_SERVICE_KEY
        value: <your-service-role-key>

  # Celery worker
  - type: worker
    name: celery-worker
    plan: starter
    region: virginia
    dockerfilePath: Dockerfile

    envVars:
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: celery-broker
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: celery-broker
          property: connectionString

  # Redis / Key Value store
  - type: keyvalue
    name: celery-broker
    plan: starter
    region: virginia
    ipAllowList: []
    maxmemoryPolicy: noeviction
