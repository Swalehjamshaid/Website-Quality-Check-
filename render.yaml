services:
  - type: web
    name: your-app-name-here 
    # ... other config ...
    envVars:
      # ...
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyValue
          name: celery-broker
# The single service item ends here.
# -------------------------------------------------------------

resources: # <--- Must align with 'services:' and 'services:' above it
  - name: celery-broker
    type: keyValue
    plan: starter
    region: us-east
    maxmemoryPolicy: noeviction
