# render.yaml – Fixed for Render Blueprint Schema (Dec 2025)
blueprints:
  - name: Website-Quality-Check  # Matches your service name
    services:
      - type: web
        name: rest-express-azay  # Keep or update to match your repo
        env: python  # This enables Python runtime (no separate pythonVersion)
        plan: free  # Or "starter"/"standard" if upgrading
        region: oregon  # Optional, recommended for low latency

        # Repository settings
        repo: https://github.com/SwalehJamshaid/Website-Quality-Check
        branch: main  # Ensure this branch has your code

        # Build & Run commands (essential for Python/Flask)
        buildCommand: pip install -r requirements.txt  # Installs deps like Flask, gunicorn
        startCommand: gunicorn app:app  # Assumes app.py with app = Flask(__name__)

        # Health check (Render pings this path)
        healthCheckPath: /

        # Auto-deploy and scaling (free tier limits to 1 instance)
        autoDeploy: true
        numInstances: 1

        # Environment variables (add real values; sync with dashboard)
        envVars:
          - key: DATABASE_URL
            value: postgresql://user:pass@host:5432/dbname  # Replace with your actual DB URL
          - key: PYTHONUNBUFFERED
            value: "1"  # Improves log visibility
          # Add more as needed, e.g.:
          # - key: SECRET_KEY
          #   value: your-app-secret
