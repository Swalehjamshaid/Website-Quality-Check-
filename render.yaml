# render.yaml (Complete Blueprint File)

# --- TOP-LEVEL SERVICES SECTION ---
services:
  - name: celery-scheduler # Name of the service being configured
    region: us-east
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app beat --loglevel info 
    
    # Environment Variables (Config Vars)
    envVars:
      # SUPABASE CREDENTIALS
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
        
      # Celery broker configuration
      - key: CELERY_BROKER_URL
        fromService:
          type: keyValue
          name: celery-broker
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyValue
          name: celery-broker

# --- TOP-LEVEL RESOURCES SECTION (MUST BE AT ZERO INDENTATION) ---
resources: # <-- FIX: This must be at the far left margin (zero indentation)
  # 4. DATA STORE (Redis/Key Value for Celery Broker)
  - name: celery-broker # Name used in the 'fromService' references above
    type: keyvalue # Defines it as a Key Value resource (Redis)
    plan: starter 
    region: us-east
    # Configuration properties for the Key Value store
    maxmemoryPolicy: noeviction
