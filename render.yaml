services:
  - type: web # Your main application service
    name: your-app-name-here # Replace with your app name
    # ... other configuration (e.g., buildCommand, startCommand) ...
    
    envVars:
      # ... (your other env vars)
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyValue
          name: celery-broker

# The services section above is now considered complete.

resources: # <--- MUST ALIGN EXACTLY WITH 'services:' at Column 1
  - name: celery-broker
    type: keyValue
    plan: starter
    region: us-east
    maxmemoryPolicy: noeviction
