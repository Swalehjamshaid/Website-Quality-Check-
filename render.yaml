services:
  - type: web
    name: website-quality-check
    runtime: docker
    region: oregon
    plan: free
    repo: https://github.com/Swalehjamshaid/Website-Quality-Check.git
    branch: master   # ← try this
    dockerfilePath: Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: '1'
