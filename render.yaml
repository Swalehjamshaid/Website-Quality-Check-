services:
  - type: web
    name: website-quality-check
    runtime: docker
    region: oregon
    plan: free

    repo: https://github.com/Swalehjamshaid/Website-Quality-Check.git
    branch: YOUR_BRANCH_NAME   # ← MUST match GitHub EXACTLY

    dockerfilePath: Dockerfile

    healthCheckPath: /

    autoDeployTrigger: commit

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
