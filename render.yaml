services:
  - type: web
    name: website-quality-check
    runtime: docker
    region: oregon
    plan: free

    repo: https://github.com/Swalehjamshaid/Website-Quality-Check-.git
    branch: main

    dockerfilePath: Dockerfile
    autoDeployTrigger: commit

    healthCheckPath: "/"

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
