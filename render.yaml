# render.yaml (Complete Blueprint File)

# --- SERVICES SECTION (Defines your Celery Scheduler) ---
services:
  - type: worker # Suitable for a Celery scheduler/worker
    name: celery-scheduler # Name of the service
    region: us-east
    plan: starter # Dedicated scheduler for scheduled tasks
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app beat --loglevel info # Targets the app.celery_app object to run the scheduler
    
    # Environment Variables (Config Vars)
    envVars:
      # --- SUPABASE CREDENTIALS ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
        
      # Celery broker configuration
      # These reference the 'celery-broker' resource defined below in the 'resources' block
      - key: CELERY_BROKER_URL
        fromService:
          type: keyValue
          name: celery-broker
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyValue
          name: celery-broker

# --- RESOURCES SECTION (Defines the Redis/Key Value Store) ---
# This block MUST be at the same indentation level as 'services:'
resources:
  # 4. DATA STORE (Redis/Key Value for Celery Broker)
  - name: celery-broker # Name used in the 'fromService' references above
    type: keyvalue # Defines it as a Key Value resource (Redis)
    plan: starter # Provides data persistence, recommended for queues
    region: us-east
    # Configuration properties for the Key Value store
    maxmemoryPolicy: noeviction
