
# render.yaml — Docker-based web service (Blueprints)
services:
  - type: web
    name: website-quality-check
    runtime: docker
    region: oregon
    plan: free

    # Your actual repo and branch
    repo: https://github.com/Swalehjamshaid/Website-Quality-Check
    branch: main

    # Tell Render to build from your Dockerfile at the repo root
    dockerfilePath: Dockerfile

    # Render performs health checks on this path
    healthCheckPath: /

    autoDeploy: true

    # Optional environment variables (add more if needed)
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
