
# render.yaml — Docker-based web service (Blueprint)
services:
  - type: web
    name: website-quality-check
    runtime: docker
    region: oregon
    plan: free

    # Your actual repo and branch (from your screenshot)
    repo: https://github.com/Swalehjamshaid/Website-Quality-Check
    branch: main

    # Build from your Dockerfile at the repo root
    dockerfilePath: Dockerfile

    # Render health check endpoint path (your app must return 200 here)
    healthCheckPath: /

    autoDeploy: true

    # Optional environment variables
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
