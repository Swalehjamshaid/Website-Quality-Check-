# Blueprint file must start with a key that defines a list (like 'services:' or 'resources:').
# The error is solved by ensuring the services: key is present.

services: # <--- THIS MUST BE THE FIRST STRUCTURAL KEY AT ZERO INDENTATION!
  - type: worker 
    name: celery-scheduler
    region: us-east
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app beat --loglevel info 
    
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
        
      - key: CELERY_BROKER_URL
        fromService:
          type: keyValue
          name: celery-broker
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyValue
          name: celery-broker

resources: # <--- This must align EXACTLY with 'services:' at the far left margin.
  - name: celery-broker
    type: keyvalue
    plan: starter 
    region: us-east
    maxmemoryPolicy: noeviction
