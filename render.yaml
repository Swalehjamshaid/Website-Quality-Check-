
# render.yaml — Docker-based web service (Blueprint)
services:
  - type: web
    name: website-quality-check
    runtime: docker
    region: oregon
    plan: free

    # Repo & branch (explicit .git suffix to avoid URL ambiguity)
    repo: https://github.com/Swalehjamshaid/Website-Quality-Check.git
    branch: main

    # Build from your Dockerfile at the repo root
    dockerfilePath: Dockerfile

    # Health check path (your app must return HTTP 200 here)
    healthCheckPath: /

    autoDeploy: true

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1
