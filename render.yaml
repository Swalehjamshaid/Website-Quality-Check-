services: # <--- FIX: This MUST be the top-level key, ending with a colon
  - type: web
    name: rest-express
    env: node
    plan: free
    # Force install of devDependencies (vite, esbuild, tsx) needed for the build script
    buildCommand: npm install --production=false && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
