
services:
  - type: web
    name: your-app-name-here
    plan: starter
    region: us-east
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app

    envVars:
      # Other env vars here as needed
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyValue
          name: celery-broker

resources:
  - name: celery-broker
    type: keyValue
    plan: starter
    region: us-east
    # Optional: add key/values if you want to populate the resource
    data:
      CELERY_RESULT_BACKEND: "redis://:password@host:6379/0"
    maxmemoryPolicy: noeviction
