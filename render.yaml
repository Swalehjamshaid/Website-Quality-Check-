services:
  - type: worker
    name: celery-scheduler
    region: us-east
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app beat --loglevel info

resources:
  - name: celery-broker
    type: keyvalue
    plan: starter
    region: us-east
    maxmemoryPolicy: noeviction
