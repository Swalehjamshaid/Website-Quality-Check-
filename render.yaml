services: # <--- MUST be at zero indentation (Column 1)

  # 1. WEB SERVICE (Your Express/Node.js App)
  - type: web 
    name: rest-express
    env: node
    plan: free
    # FIX: Add rootDir to resolve the "ENOENT: package.json" error.
    # Adjust the path below if your package.json is not in a folder named 'backend'
    rootDir: ./backend 
    buildCommand: npm install --production=false && npm run build
    startCommand: npm run start
    # You may need to add SUPABASE env vars here if your Express app uses them
    
  # 2. WORKER SERVICE (Your Celery Scheduler/Worker)
  - type: worker 
    name: celery-scheduler
    region: us-east
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app beat --loglevel info 
    
    envVars:
      # SUPABASE Credentials
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
        
      # Celery Broker configuration (References the resource below)
      - key: CELERY_BROKER_URL
        fromService:
          type: keyValue
          name: celery-broker
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyValue
          name: celery-broker

resources: # <--- MUST align exactly with 'services:' at zero indentation (Column 1)
  # 3. KEY-VALUE STORE (Redis for Celery Broker)
  - name: celery-broker
    type: keyvalue
    plan: starter 
    region: us-east
    maxmemoryPolicy: noeviction
