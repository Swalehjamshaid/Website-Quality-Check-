services:
  # Main Web Service (Flask + Gunicorn)
  - type: web
    name: website-quality-check
    runtime: docker
    repo: https://github.com/SwalehJamshaid/Website-Quality-Check
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /
    autoDeploy: true

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        generateValue: true   # Auto-generates secure key

  # Background Worker (Celery)
  - type: worker
    name: website-quality-check-worker
    runtime: docker
    repo: https://github.com/SwalehJamshaid/Website-Quality-Check
    dockerfilePath: Dockerfile
    plan: free
    dockerCommand: celery -A app.celery_app worker --loglevel=info

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        fromService:
          name: website-quality-check
          envVarKey: SECRET_KEY
