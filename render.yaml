
services:
  - type: web
    name: your-app-name-here
    plan: starter
    region: us-east
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app

    envVars:
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: celery-broker
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: celery-broker
          property: connectionString

resources:
  - name: celery-broker
    type: redis
    plan: starter
    region: us-east
    maxmemoryPolicy: noeviction
